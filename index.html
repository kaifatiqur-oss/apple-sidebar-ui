<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Auralis Studios</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          transitionTimingFunction: {
            'apple': 'cubic-bezier(0.25, 0.1, 0.25, 1)',
            'spring': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
          }
        }
      }
    }
  </script>

  <style>
    * {
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background-color 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    body.dark {
      background: #09090b;
    }

    body.light {
      background: #f4f4f5;
    }

    body.dark::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 90% 70% at 15% 25%, rgba(55,55,70,0.35) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 75%, rgba(40,40,55,0.25) 0%, transparent 50%);
      pointer-events: none;
    }

    body.light::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 90% 70% at 15% 25%, rgba(210,210,230,0.5) 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 85% 75%, rgba(190,190,210,0.35) 0%, transparent 50%);
      pointer-events: none;
    }

    .sidebar {
      transition: 
        width 0.45s cubic-bezier(0.25, 0.1, 0.25, 1),
        background-color 0.45s cubic-bezier(0.25, 0.1, 0.25, 1),
        border-color 0.45s cubic-bezier(0.25, 0.1, 0.25, 1),
        box-shadow 0.45s cubic-bezier(0.25, 0.1, 0.25, 1);
      will-change: width;
    }

    .fade-slide {
      transition: 
        opacity 0.32s cubic-bezier(0.25, 0.1, 0.25, 1),
        transform 0.32s cubic-bezier(0.25, 0.1, 0.25, 1),
        max-width 0.32s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .menu-item {
      transition: 
        background-color 0.2s cubic-bezier(0.25, 0.1, 0.25, 1),
        color 0.2s cubic-bezier(0.25, 0.1, 0.25, 1),
        transform 0.18s cubic-bezier(0.25, 0.1, 0.25, 1),
        box-shadow 0.2s ease;
    }

    .menu-item:hover {
      transform: translateX(2px);
    }

    .menu-item:active {
      transform: scale(0.97);
    }

    .active-indicator {
      transition: 
        height 0.28s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.25s ease;
    }

    .toggle-btn, .theme-btn {
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .toggle-btn:hover, .theme-btn:hover {
      transform: scale(1.1);
    }

    .toggle-btn:active, .theme-btn:active {
      transform: scale(0.93);
    }

    .badge {
      transition: 
        transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1),
        opacity 0.3s ease;
    }

    .logo-box {
      transition: background 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .search-box {
      transition: 
        background-color 0.25s cubic-bezier(0.25, 0.1, 0.25, 1),
        border-color 0.25s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .search-box:hover {
      transform: translateY(-1px);
    }
  </style>
</head>
<body class="dark">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ children, size = 20 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
        {children}
      </svg>
    );

    const icons = {
      home: <Icon><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>,
      search: <Icon size={18}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>,
      library: <Icon><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></Icon>,
      playlist: <Icon><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></Icon>,
      heart: <Icon><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></Icon>,
      radio: <Icon><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></Icon>,
      mic: <Icon><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></Icon>,
      album: <Icon><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></Icon>,
      chevron: <Icon size={14}><polyline points="15 18 9 12 15 6"/></Icon>,
      sun: <Icon size={16}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></Icon>,
      moon: <Icon size={16}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></Icon>,
    };

    function Sidebar() {
      const [expanded, setExpanded] = useState(false);
      const [active, setActive] = useState('home');
      const [darkMode, setDarkMode] = useState(true);
      const [mounted, setMounted] = useState(false);

      useEffect(() => {
        setMounted(true);
        document.body.className = darkMode ? 'dark' : 'light';
      }, [darkMode]);

      const items = [
        { id: 'home', label: 'Home', icon: icons.home },
        { id: 'search', label: 'Search', icon: icons.search },
        { id: 'library', label: 'Your Library', icon: icons.library },
        { id: 'playlists', label: 'Playlists', icon: icons.playlist, badge: 12 },
        { id: 'liked', label: 'Liked Songs', icon: icons.heart },
        { id: 'artists', label: 'Artists', icon: icons.mic },
        { id: 'albums', label: 'Albums', icon: icons.album },
        { id: 'radio', label: 'Radio', icon: icons.radio },
      ];

      const theme = darkMode ? {
        sidebarBg: 'bg-[#141416]/92',
        border: 'border-white/[0.08]',
        textPrimary: 'text-white',
        textSecondary: 'text-zinc-400',
        textMuted: 'text-zinc-500',
        hoverBg: 'hover:bg-white/[0.07]',
        activeBg: 'bg-white/[0.11]',
        activeText: 'text-white',
        searchBg: 'bg-white/[0.05]',
        searchHover: 'hover:bg-white/[0.08]',
        searchBorder: 'border-white/[0.06]',
        logoBg: 'bg-gradient-to-br from-zinc-600 to-zinc-800',
        logoBorder: 'border-white/10',
        toggleBg: 'bg-[#1c1c1e] border-white/10 text-zinc-400 hover:text-white hover:bg-[#2c2c2e]',
        proBg: 'bg-white text-black',
        divider: 'border-white/[0.06]',
        shadow: 'shadow-[0_25px_60px_-12px_rgba(0,0,0,0.65)]',
        badge: 'bg-[#0a84ff]',
        indicator: 'bg-[#0a84ff]',
      } : {
        sidebarBg: 'bg-white/95',
        border: 'border-black/[0.08]',
        textPrimary: 'text-zinc-900',
        textSecondary: 'text-zinc-600',
        textMuted: 'text-zinc-400',
        hoverBg: 'hover:bg-zinc-100',
        activeBg: 'bg-zinc-100',
        activeText: 'text-zinc-900',
        searchBg: 'bg-zinc-100',
        searchHover: 'hover:bg-zinc-150',
        searchBorder: 'border-black/[0.06]',
        logoBg: 'bg-gradient-to-br from-zinc-200 to-zinc-300',
        logoBorder: 'border-black/10',
        toggleBg: 'bg-white border-black/10 text-zinc-500 hover:text-zinc-900 hover:bg-zinc-50',
        proBg: 'bg-zinc-900 text-white',
        divider: 'border-black/[0.06]',
        shadow: 'shadow-[0_25px_50px_-12px_rgba(0,0,0,0.15)]',
        badge: 'bg-[#0a84ff]',
        indicator: 'bg-[#0a84ff]',
      };

      return (
        <div className={`relative transition-opacity duration-500 ${mounted ? 'opacity-100' : 'opacity-0'}`}>
          <div 
            className={`
              sidebar 
              ${theme.sidebarBg} backdrop-blur-2xl 
              border ${theme.border}
              rounded-[28px] 
              ${theme.shadow}
              flex flex-col overflow-hidden
              ${expanded ? 'w-[280px]' : 'w-[72px]'}
            `}
          >
            <div className="flex items-center gap-3 px-4 pt-5 pb-3">
              <div className={`logo-box w-9 h-9 min-w-[36px] rounded-[12px] ${theme.logoBg} flex items-center justify-center ${theme.textPrimary} shadow-inner border ${theme.logoBorder}`}>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M9 18V5l12-2v13"/>
                  <circle cx="6" cy="18" r="3"/>
                  <circle cx="18" cy="16" r="3"/>
                </svg>
              </div>
              <span className={`text-[15px] font-semibold ${theme.textPrimary} tracking-tight fade-slide whitespace-nowrap overflow-hidden ${expanded ? 'opacity-100 translate-x-0 max-w-[140px]' : 'opacity-0 -translate-x-3 max-w-0'}`}>
                Auralis Studios
              </span>

              <button
                onClick={() => setDarkMode(!darkMode)}
                className={`theme-btn ml-auto w-7 h-7 rounded-full flex items-center justify-center border ${theme.toggleBg} ${expanded ? 'opacity-100' : 'opacity-0 pointer-events-none'}`}
                title={darkMode ? 'Light mode' : 'Dark mode'}
              >
                {darkMode ? icons.sun : icons.moon}
              </button>
            </div>

            <div className={`search-box mx-3 mb-4 flex items-center gap-2.5 ${theme.searchBg} ${theme.searchHover} rounded-[14px] border ${theme.searchBorder} ${expanded ? 'px-3.5 py-2.5' : 'justify-center p-2.5'}`}>
              <span className={`${theme.textMuted} flex-shrink-0`}>{icons.search}</span>
              <input
                placeholder="Search music..."
                className={`bg-transparent text-[13px] ${theme.textPrimary} outline-none w-full fade-slide placeholder:text-zinc-500 ${expanded ? 'opacity-100' : 'opacity-0 w-0'}`}
              />
            </div>

            <div className={`px-5 mb-1.5 text-[11px] font-medium ${theme.textMuted} tracking-wider uppercase fade-slide overflow-hidden ${expanded ? 'opacity-100 h-auto' : 'opacity-0 h-0'}`}>
              Menu
            </div>

            <nav className="flex-1 px-2.5 space-y-0.5 pb-2">
              {items.map((item) => {
                const isActive = active === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActive(item.id)}
                    className={`
                      menu-item relative w-full flex items-center gap-3 px-3 py-[10px] rounded-[14px] text-left
                      ${isActive 
                        ? `${theme.activeBg} ${theme.activeText}` 
                        : `${theme.textSecondary} ${theme.hoverBg}`}
                    `}
                  >
                    <div 
                      className={`active-indicator absolute left-0 top-1/2 -translate-y-1/2 w-[3px] rounded-r-full ${theme.indicator} ${isActive ? 'h-[18px] opacity-100' : 'h-0 opacity-0'}`}
                    />
                    
                    <span className={`flex-shrink-0 ${isActive ? theme.activeText : ''}`}>
                      {item.icon}
                    </span>
                    
                    <span className={`text-[13.5px] font-medium fade-slide whitespace-nowrap overflow-hidden ${expanded ? 'opacity-100 translate-x-0 max-w-[140px]' : 'opacity-0 -translate-x-2 max-w-0'}`}>
                      {item.label}
                    </span>

                    {item.badge && (
                      <span className={`ml-auto text-[11px] font-semibold ${theme.badge} text-white px-1.5 py-0.5 rounded-full min-w-[20px] text-center badge ${expanded ? 'opacity-100 scale-100' : 'opacity-0 scale-75'}`}>
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </nav>

            <div className={`mt-1 px-3 pb-5 pt-3 border-t ${theme.divider}`}>
              <button className={`w-full flex items-center gap-2.5 px-3 py-2.5 rounded-[14px] ${theme.hoverBg} transition-colors duration-200`}>
                <div className={`w-6 h-6 min-w-[24px] rounded-full ${theme.proBg} text-[10px] font-bold flex items-center justify-center shadow-sm`}>
                  Pro
                </div>
                <span className={`text-[13px] ${theme.textSecondary} font-medium fade-slide whitespace-nowrap overflow-hidden ${expanded ? 'opacity-100 max-w-[140px]' : 'opacity-0 max-w-0'}`}>
                  Upgrade to Pro
                </span>
              </button>
            </div>
          </div>

          <button
            onClick={() => setExpanded(!expanded)}
            className={`toggle-btn absolute top-[22px] -right-[14px] w-7 h-7 rounded-full border flex items-center justify-center shadow-lg z-20 ${theme.toggleBg}`}
          >
            <span className={`transition-transform duration-400 ease-apple ${expanded ? '' : 'rotate-180'}`}>
              {icons.chevron}
            </span>
          </button>

          {!expanded && (
            <button
              onClick={() => setDarkMode(!darkMode)}
              className={`theme-btn absolute top-[58px] -right-[14px] w-7 h-7 rounded-full border flex items-center justify-center shadow-lg z-20 ${theme.toggleBg}`}
              title={darkMode ? 'Light mode' : 'Dark mode'}
            >
              {darkMode ? icons.sun : icons.moon}
            </button>
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Sidebar />);
  </script>
</body>
</html>
