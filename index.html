<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebar — Apple Design</title>

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          transitionTimingFunction: {
            'apple': 'cubic-bezier(0.25, 0.1, 0.25, 1)',
            'spring': 'cubic-bezier(0.34, 1.56, 0.64, 1)',
          }
        }
      }
    }
  </script>

  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #0c0c0c;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 90% 60% at 15% 30%, rgba(50,50,55,0.45) 0%, transparent 60%),
        radial-gradient(ellipse 70% 50% at 85% 70%, rgba(35,35,40,0.4) 0%, transparent 55%);
      pointer-events: none;
    }

    .sidebar {
      transition: width 0.4s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .fade-slide {
      transition: opacity 0.3s cubic-bezier(0.25, 0.1, 0.25, 1),
                  transform 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
  </style>
</head>
<body>
  <div id="root"></div>

  <script type="text/babel">
    const { useState } = React;

    const Icon = ({ children, size = 20 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
        {children}
      </svg>
    );

    const icons = {
      home: <Icon><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>,
      lock: <Icon><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></Icon>,
      trending: <Icon><polyline points="23 6 13.5 15.5 8.5 10.5 1 18"/><polyline points="17 6 23 6 23 12"/></Icon>,
      tag: <Icon><path d="M20.59 13.41l-7.17 7.17a2 2 0 0 1-2.83 0L2 12V2h10l8.59 8.59a2 2 0 0 1 0 2.82z"/><line x1="7" y1="7" x2="7.01" y2="7"/></Icon>,
      list: <Icon><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></Icon>,
      monitor: <Icon><rect x="2" y="3" width="20" height="14" rx="2"/><line x1="8" y1="21" x2="16" y2="21"/><line x1="12" y1="17" x2="12" y2="21"/></Icon>,
      plus: <Icon><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></Icon>,
      search: <Icon size={16}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>,
      cloud: <Icon size={16}><path d="M18 10h-1.26A8 8 0 1 0 9 20h9a5 5 0 0 0 0-10z"/></Icon>,
      chevron: <Icon size={14}><polyline points="15 18 9 12 15 6"/></Icon>,
    };

    function Sidebar() {
      const [expanded, setExpanded] = useState(true);
      const [active, setActive] = useState('home');

      const items = [
        { id: 'home', label: 'Home', icon: icons.home },
        { id: 'torrents', label: 'Torrents', icon: icons.lock, badge: 3 },
        { id: 'trending', label: 'Trending Videos', icon: icons.trending },
        { id: 'labels', label: 'Labels', icon: icons.tag },
        { id: 'feeds', label: 'Feeds', icon: icons.list },
        { id: 'devices', label: 'Devices', icon: icons.monitor },
        { id: 'btfs', label: 'BTFS', icon: icons.plus },
      ];

      return (
        <div className="relative">
          <div className={`sidebar bg-[#161616]/90 backdrop-blur-xl border border-white/[0.06] rounded-[26px] shadow-2xl flex flex-col overflow-hidden ${expanded ? 'w-[272px]' : 'w-[70px]'}`}>
            
            {/* Traffic lights */}
            <div className="flex gap-2 px-5 pt-4 pb-1">
              <div className="w-3 h-3 rounded-full bg-[#ff5f57]"></div>
              <div className="w-3 h-3 rounded-full bg-[#febc2e]"></div>
              <div className="w-3 h-3 rounded-full bg-[#28c840]"></div>
            </div>

            {/* Logo */}
            <div className="flex items-center gap-3 px-4 py-4">
              <div className="w-8 h-8 rounded-[10px] bg-gradient-to-br from-neutral-700 to-neutral-800 flex items-center justify-center text-white shadow-inner">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor">
                  <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
                </svg>
              </div>
              <span className={`text-[15px] font-semibold text-white tracking-tight fade-slide ${expanded ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-2 absolute'}`}>
                Sidebar UI
              </span>
            </div>

            {/* Search */}
            <div className={`mx-3 mb-4 flex items-center gap-2 bg-white/[0.04] rounded-[12px] border border-white/[0.04] ${expanded ? 'px-3 py-2' : 'justify-center p-2.5'}`}>
              <span className="text-neutral-500">{icons.search}</span>
              <input
                placeholder="Search"
                className={`bg-transparent text-[13px] text-neutral-300 placeholder:text-neutral-600 outline-none w-full fade-slide ${expanded ? 'opacity-100' : 'opacity-0 w-0'}`}
              />
            </div>

            {/* Section label */}
            <div className={`px-5 mb-1.5 text-[11px] font-medium text-neutral-600 tracking-wide fade-slide ${expanded ? 'opacity-100' : 'opacity-0 h-0'}`}>
              Menu
            </div>

            {/* Navigation */}
            <nav className="flex-1 px-2.5 space-y-0.5">
              {items.map((item) => {
                const isActive = active === item.id;
                return (
                  <button
                    key={item.id}
                    onClick={() => setActive(item.id)}
                    className={`
                      relative w-full flex items-center gap-3 px-3 py-[9px] rounded-[12px] text-left
                      transition-all duration-200 ease-apple
                      ${isActive 
                        ? 'bg-white/[0.08] text-white' 
                        : 'text-neutral-400 hover:bg-white/[0.04] hover:text-neutral-200'}
                    `}
                  >
                    {isActive && (
                      <div className="absolute left-0 top-1/2 -translate-y-1/2 w-[3px] h-[18px] bg-[#0a84ff] rounded-r-full"></div>
                    )}
                    <span className={isActive ? 'text-white' : ''}>{item.icon}</span>
                    <span className={`text-[13.5px] font-medium fade-slide ${expanded ? 'opacity-100 translate-x-0' : 'opacity-0 -translate-x-1'}`}>
                      {item.label}
                    </span>
                    {item.badge && expanded && (
                      <span className="ml-auto text-[11px] font-semibold bg-[#0a84ff] text-white px-1.5 py-0.5 rounded-full min-w-[20px] text-center">
                        {item.badge}
                      </span>
                    )}
                  </button>
                );
              })}
            </nav>

            {/* Bottom */}
            <div className="mt-2 px-3 pb-4 pt-3 border-t border-white/[0.05]">
              <button className="w-full flex items-center gap-2.5 px-3 py-2 rounded-[12px] hover:bg-white/[0.04] transition-colors">
                <div className="w-6 h-6 rounded-full bg-white text-black text-[10px] font-bold flex items-center justify-center">
                  Pro
                </div>
                <span className={`text-[13px] text-neutral-300 font-medium fade-slide ${expanded ? 'opacity-100' : 'opacity-0'}`}>
                  Upgrade to Pro
                </span>
              </button>

              <div className="flex items-center gap-2.5 px-3 mt-2 text-neutral-500">
                {icons.cloud}
                <span className={`text-[12px] fade-slide ${expanded ? 'opacity-100' : 'opacity-0'}`}>
                  Download Torrents Faster
                </span>
              </div>
            </div>
          </div>

          {/* Toggle */}
          <button
            onClick={() => setExpanded(!expanded)}
            className="absolute top-[18px] -right-[13px] w-6 h-6 rounded-full bg-[#1c1c1c] border border-white/10 flex items-center justify-center text-neutral-400 hover:text-white hover:bg-[#252525] transition-all duration-200 shadow-lg"
          >
            <span className={`transition-transform duration-300 ease-apple ${expanded ? '' : 'rotate-180'}`}>
              {icons.chevron}
            </span>
          </button>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<Sidebar />);
  </script>
</body>
</html>
