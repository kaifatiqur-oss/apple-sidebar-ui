<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sidebar UI - Auralis Studios</title>
  <meta name="description" content="Premium collapsible sidebar UI for Auralis Studios music streaming app" />
  <meta property="og:title" content="Sidebar UI - Auralis Studios" />
  <meta property="og:description" content="Premium collapsible sidebar UI for Auralis Studios music streaming app" />
  <meta property="og:type" content="website" />

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/react@18.2.0/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18.2.0/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: {
            sans: ['-apple-system', 'BlinkMacSystemFont', 'SF Pro Display', 'Segoe UI', 'Roboto', 'sans-serif'],
          },
          transitionTimingFunction: {
            'apple': 'cubic-bezier(0.25, 0.1, 0.25, 1)',
            'spring': 'cubic-bezier(0.34, 1.4, 0.44, 1)',
          }
        }
      }
    }
  </script>

  <style>
    * { -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
      transition: background-color 0.5s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    body.dark { background: #080A14; }
    body.light { background: #ffffff; }

    body.dark::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(139,92,246,0.18) 0%, transparent 50%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(56,189,248,0.12) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    body.light::before {
      content: '';
      position: absolute;
      inset: 0;
      background: 
        radial-gradient(ellipse 80% 60% at 20% 30%, rgba(139,92,246,0.04) 0%, transparent 50%),
        radial-gradient(ellipse 60% 50% at 80% 70%, rgba(56,189,248,0.03) 0%, transparent 50%);
      pointer-events: none;
      z-index: 0;
    }

    #root {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    .sidebar {
      transition: width 0.45s cubic-bezier(0.25, 0.1, 0.25, 1),
                  background-color 0.45s cubic-bezier(0.25, 0.1, 0.25, 1),
                  border-color 0.45s cubic-bezier(0.25, 0.1, 0.25, 1),
                  box-shadow 0.45s cubic-bezier(0.25, 0.1, 0.25, 1);
      will-change: width;
    }

    .fade-slide {
      transition: opacity 0.32s cubic-bezier(0.25, 0.1, 0.25, 1),
                  transform 0.32s cubic-bezier(0.25, 0.1, 0.25, 1),
                  max-width 0.32s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .menu-item {
      transition: background-color 0.2s cubic-bezier(0.25, 0.1, 0.25, 1),
                  color 0.2s cubic-bezier(0.25, 0.1, 0.25, 1),
                  transform 0.18s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .menu-item:hover { transform: translateX(2px); }
    .menu-item:active { transform: scale(0.97); }

    .active-indicator {
      transition: height 0.28s cubic-bezier(0.34, 1.4, 0.44, 1), opacity 0.25s ease;
    }

    .toggle-btn, .theme-btn, .nav-btn {
      transition: all 0.3s cubic-bezier(0.25, 0.1, 0.25, 1);
    }
    .toggle-btn:hover, .theme-btn:hover, .nav-btn:hover { transform: scale(1.05); }
    .toggle-btn:active, .theme-btn:active, .nav-btn:active { transform: scale(0.95); }

    .badge {
      transition: transform 0.3s cubic-bezier(0.34, 1.4, 0.44, 1), opacity 0.3s ease;
    }

    .search-box, .top-search {
      transition: background-color 0.25s cubic-bezier(0.25, 0.1, 0.25, 1),
                  border-color 0.25s cubic-bezier(0.25, 0.1, 0.25, 1),
                  box-shadow 0.25s ease;
    }

    .top-nav {
      transition: background-color 0.45s cubic-bezier(0.25, 0.1, 0.25, 1),
                  border-color 0.45s cubic-bezier(0.25, 0.1, 0.25, 1);
    }

    .cta-btn {
      transition: transform 0.2s cubic-bezier(0.25, 0.1, 0.25, 1),
                  box-shadow 0.2s ease,
                  opacity 0.2s ease;
    }
    .cta-btn:hover { transform: translateY(-1px); box-shadow: 0 8px 20px rgba(139, 92, 246, 0.35); }
    .cta-btn:active { transform: scale(0.97); }
  </style>
</head>
<body class="dark">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect } = React;

    const Icon = ({ children, size = 20 }) => (
      <svg width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="1.7" strokeLinecap="round" strokeLinejoin="round">
        {children}
      </svg>
    );

    const AuralisLogo = ({ size = 32 }) => (
      <svg width={size} height={size} viewBox="0 0 48 48" fill="none" aria-label="Auralis Studio">
        <defs>
          <linearGradient id="aur" x1="0" y1="0" x2="48" y2="48">
            <stop offset="0" stopColor="#8B5CF6"/>
            <stop offset="0.55" stopColor="#38BDF8"/>
            <stop offset="1" stopColor="#F472B6"/>
          </linearGradient>
        </defs>
        <rect x="2" y="2" width="44" height="44" rx="14" fill="url(#aur)" opacity="0.92"/>
        <path d="M24 11 33.5 36h-4.6l-2-5.6H21l-2 5.6h-4.5L24 11Zm0 10.4-1.7 4.8h3.5L24 21.4Z" fill="white"/>
        <path d="M9 38.5c5-3 10 2 15-.5s10-2.5 15 .5" stroke="white" strokeWidth="1.8" strokeLinecap="round" opacity="0.75"/>
      </svg>
    );

    const icons = {
      home: <Icon><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></Icon>,
      search: <Icon size={18}><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></Icon>,
      library: <Icon><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"/><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"/></Icon>,
      playlist: <Icon><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></Icon>,
      heart: <Icon><path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"/></Icon>,
      radio: <Icon><circle cx="12" cy="12" r="2"/><path d="M16.24 7.76a6 6 0 0 1 0 8.49m-8.48-.01a6 6 0 0 1 0-8.49m11.31-2.82a10 10 0 0 1 0 14.14m-14.14 0a10 10 0 0 1 0-14.14"/></Icon>,
      mic: <Icon><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2"/><line x1="12" y1="19" x2="12" y2="23"/><line x1="8" y1="23" x2="16" y2="23"/></Icon>,
      album: <Icon><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="3"/></Icon>,
      chevron: <Icon size={14}><polyline points="15 18 9 12 15 6"/></Icon>,
      sun: <Icon size={16}><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></Icon>,
      moon: <Icon size={16}><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></Icon>,
      bell: <Icon size={18}><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></Icon>,
      user: <Icon size={18}><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></Icon>,
    };

    function App() {
      const [expanded, setExpanded] = useState(false);
      const [active, setActive] = useState('home');
      const [darkMode, setDarkMode] = useState(true);
      const [mounted, setMounted] = useState(false);

      useEffect(() => {
        setMounted(true);
        document.body.className = darkMode ? 'dark' : 'light';
      }, [darkMode]);

      const items = [
        { id: 'home', label: 'Home', icon: icons.home },
        { id: 'search', label: 'Search', icon: icons.search },
        { id: 'library', label: 'Your Library', icon: icons.library },
        { id: 'playlists', label: 'Playlists', icon: icons.playlist, badge: 12 },
        { id: 'liked', label: 'Liked Songs', icon: icons.heart },
        { id: 'artists', label: 'Artists', icon: icons.mic },
        { id: 'albums', label: 'Albums', icon: icons.album },
        { id: 'radio', label: 'Radio', icon: icons.radio },
      ];

      const theme = darkMode ? {
        navBg: 'bg-[#0c0e1a]/90',
        navBorder: 'border-white/[0.06]',
        sidebarBg: 'bg-[#161A2C]/92',
        border: 'border-white/[0.08]',
        textPrimary: 'text-[#F5F7FF]',
        textSecondary: 'text-[#A8AFC8]',
        textMuted: 'text-[#767D98]',
        hoverBg: 'hover:bg-white/[0.06]',
        activeBg: 'bg-white/[0.1]',
        activeText: 'text-white',
        searchBg: 'bg-white/[0.05]',
        searchHover: 'hover:bg-white/[0.08]',
        searchBorder: 'border-white/[0.06]',
        toggleBg: 'bg-[#1E2238] border-white/10 text-[#A8AFC8] hover:text-white hover:bg-[#2a2f4a]',
        proBg: 'bg-gradient-to-r from-[#8B5CF6] to-[#38BDF8] text-white',
        divider: 'border-white/[0.06]',
        shadow: 'shadow-[0_25px_60px_-12px_rgba(0,0,0,0.6)]',
        badge: 'bg-[#8B5CF6]',
        indicator: 'bg-[#8B5CF6]',
        ghostBtn: 'text-[#A8AFC8] hover:text-white hover:bg-white/[0.06]',
      } : {
        navBg: 'bg-white/95',
        navBorder: 'border-gray-200',
        sidebarBg: 'bg-white',
        border: 'border-gray-200',
        textPrimary: 'text-gray-900',
        textSecondary: 'text-gray-600',
        textMuted: 'text-gray-400',
        hoverBg: 'hover:bg-gray-50',
        activeBg: 'bg-violet-50',
        activeText: 'text-violet-700',
        searchBg: 'bg-gray-50',
        searchHover: 'hover:bg-gray-100',
        searchBorder: 'border-gray-200',
        toggleBg: 'bg-white border-gray-200 text-gray-500 hover:text-gray-900 hover:bg-gray-50',
        proBg: 'bg-gradient-to-r from-[#8B5CF6] to-[#38BDF8] text-white',
        divider: 'border-gray-200',
        shadow: 'shadow-[0_8px_30px_rgba(0,0,0,0.08)]',
        badge: 'bg-[#8B5CF6]',
        indicator: 'bg-[#8B5CF6]',
        ghostBtn: 'text-gray-600 hover:text-gray-900 hover:bg-gray-50',
      };

      return (
        <div className={`w-full h-full flex flex-col transition-opacity duration-500 ${mounted ? 'opacity-100' : 'opacity-0'}`}>
          
          <header className={`top-nav h-14 min-h-[56px] flex items-center gap-4 px-4 md:px-6 border-b ${theme.navBg} backdrop-blur-xl ${theme.navBorder} z-30`}>
            <div className="flex items-center gap-2.5 flex-shrink-0">
              <AuralisLogo size={28} />
              <span className={`text-[15px] font-semibold ${theme.textPrimary} tracking-tight hidden sm:block`}>
                Auralis Studios
              </span>
            </div>

            <div className={`top-search flex-1 max-w-xl mx-auto flex items-center gap-2.5 ${theme.searchBg} ${theme.searchHover} rounded-full border ${theme.searchBorder} px-4 py-2`}>
              <span className={theme.textMuted}>{icons.search}</span>
              <input
                placeholder="Search songs, artists, albums..."
                className={`bg-transparent text-[13px] ${theme.textPrimary} outline-none w-full placeholder:text-zinc-500`}
              />
            </div>

            <div className="flex items-center gap-2 flex-shrink-0">
              <button
                onClick={() => setDarkMode(!darkMode)}
                className={`theme-btn w-9 h-9 rounded-full flex items-center justify-center border ${theme.toggleBg}`}
                title={darkMode ? 'Light mode' : 'Dark mode'}
              >
                {darkMode ? icons.sun : icons.moon}
              </button>

              <button className={`nav-btn w-9 h-9 rounded-full flex items-center justify-center ${theme.ghostBtn}`}>
                {icons.bell}
              </button>

              <button className={`nav-btn hidden sm:flex items-center gap-1.5 px-3.5 py-1.5 rounded-full text-[13px] font-medium ${theme.ghostBtn}`}>
                Sign in
              </button>

              <button className="cta-btn hidden sm:flex items-center px-4 py-1.5 rounded-full text-[13px] font-semibold text-white bg-gradient-to-r from-[#8B5CF6] to-[#38BDF8]">
                Create account
              </button>

              <button className={`nav-btn sm:hidden w-9 h-9 rounded-full flex items-center justify-center ${theme.ghostBtn}`}>
                {icons.user}
              </button>
            </div>
          </header>

          <div className="flex-1 flex overflow-hidden relative">
            <div className="relative flex-shrink-0 pl-3 pt-3 pb-3">
              <div 
                className={`
                  sidebar h-full
                  ${theme.sidebarBg} backdrop-blur-2xl 
                  border ${theme.border}
                  rounded-[24px] 
                  ${theme.shadow}
                  flex flex-col overflow-hidden
                  ${expanded ? 'w-[260px]' : 'w-[68px]'}
                `}
              >
                <div className={`mx-2.5 mt-3 mb-3 flex items-center gap-2.5 ${theme.searchBg} ${theme.searchHover} rounded-[12px] border ${theme.searchBorder} ${expanded ? 'px-3 py-2' : 'justify-center p-2'}`}>
                  <span className={`${theme.textMuted} flex-shrink-0`}>{icons.search}</span>
                  <input
                    placeholder="Search..."
                    className={`bg-transparent text-[13px] ${theme.textPrimary} outline-none w-full fade-slide placeholder:text-zinc-500 ${expanded ? 'opacity-100' : 'opacity-0 w-0'}`}
                  />
                </div>

                <div className={`px-4 mb-1 text-[11px] font-medium ${theme.textMuted} tracking-wider uppercase fade-slide overflow-hidden ${expanded ? 'opacity-100 h-auto' : 'opacity-0 h-0'}`}>
                  Menu
                </div>

                <nav className="flex-1 px-2 space-y-0.5 pb-2 overflow-y-auto">
                  {items.map((item) => {
                    const isActive = active === item.id;
                    return (
                      <button
                        key={item.id}
                        onClick={() => setActive(item.id)}
                        className={`
                          menu-item relative w-full flex items-center gap-3 px-2.5 py-[9px] rounded-[12px] text-left
                          ${isActive 
                            ? `${theme.activeBg} ${theme.activeText}` 
                            : `${theme.textSecondary} ${theme.hoverBg}`}
                        `}
                      >
                        <div 
                          className={`active-indicator absolute left-0 top-1/2 -translate-y-1/2 w-[3px] rounded-r-full ${theme.indicator} ${isActive ? 'h-[16px] opacity-100' : 'h-0 opacity-0'}`}
                        />
                        
                        <span className={`flex-shrink-0 ${isActive ? theme.activeText : ''}`}>
                          {item.icon}
                        </span>
                        
                        <span className={`text-[13px] font-medium fade-slide whitespace-nowrap overflow-hidden ${expanded ? 'opacity-100 translate-x-0 max-w-[130px]' : 'opacity-0 -translate-x-2 max-w-0'}`}>
                          {item.label}
                        </span>

                        {item.badge && (
                          <span className={`ml-auto text-[11px] font-semibold ${theme.badge} text-white px-1.5 py-0.5 rounded-full min-w-[18px] text-center badge ${expanded ? 'opacity-100 scale-100' : 'opacity-0 scale-75'}`}>
                            {item.badge}
                          </span>
                        )}
                      </button>
                    );
                  })}
                </nav>

                <div className={`mt-1 px-2.5 pb-4 pt-2 border-t ${theme.divider}`}>
                  <button className={`w-full flex items-center gap-2.5 px-2.5 py-2 rounded-[12px] ${theme.hoverBg} transition-colors duration-200`}>
                    <div className={`w-6 h-6 min-w-[24px] rounded-full ${theme.proBg} text-[10px] font-bold flex items-center justify-center shadow-sm`}>
                      Pro
                    </div>
                    <span className={`text-[13px] ${theme.textSecondary} font-medium fade-slide whitespace-nowrap overflow-hidden ${expanded ? 'opacity-100 max-w-[130px]' : 'opacity-0 max-w-0'}`}>
                      Upgrade to Pro
                    </span>
                  </button>
                </div>
              </div>

              <button
                onClick={() => setExpanded(!expanded)}
                className={`toggle-btn absolute top-6 -right-[12px] w-6 h-6 rounded-full border flex items-center justify-center shadow-lg z-20 ${theme.toggleBg}`}
              >
                <span className={`transition-transform duration-400 ease-apple ${expanded ? '' : 'rotate-180'}`}>
                  {icons.chevron}
                </span>
              </button>
            </div>

            <main className="flex-1 flex items-center justify-center p-6">
              <div className={`text-center ${theme.textMuted}`}>
                <p className="text-sm opacity-60">Main content area</p>
                <p className="text-xs mt-1 opacity-40">Sidebar + Top Nav ready for Auralis Studios</p>
              </div>
            </main>
          </div>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
